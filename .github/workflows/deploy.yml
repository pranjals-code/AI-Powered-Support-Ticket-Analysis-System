name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 3.109.169.70   # 👈 tera Elastic IP
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ec2-user/AI-Powered-Support-Ticket-Analysis-System
          git pull origin main
          sudo systemctl restart fastapi
          sudo systemctl restart celery